name: Build ECHO Beta APK

# Runs on demand, or on a v* tag. Not on every push to main: an APK build is slow and
# nobody wants a new install prompt for a one-line CSS change.
on:
  workflow_dispatch:
  push:
    tags:
      - 'beta-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant/frontend

    steps:
      - uses: actions/checkout@v4

      # Capacitor 8's CLI refuses to run on anything below Node 22. Angular 17 predates
      # Node 22 and warns about it, but only hard-fails on odd-numbered majors, so a
      # single Node 22 step serves both the web build and cap sync.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: assistant/frontend/package-lock.json

      # Capacitor loads the app from the APK's own assets over https://localhost, not from
      # a subpath, so this build must NOT use the /PersonalAgent/ base-href the Pages
      # workflow sets — with that in place every asset would 404 inside the app.
      # Stamped before the build so it is bundled into the APK's own assets, and published
      # alongside the APK so the installed app can compare the two. Without a build stamp
      # inside the app there is nothing to compare a release against — "is there an update"
      # needs to know what you are already running.
      - name: Stamp the build
        run: |
          printf '{"sha":"%s","builtAt":"%s"}\n' \
            "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee src/assets/build-info.json version.json

      - name: Rebrand as the beta app
        run: |
          set -euo pipefail

          # applicationId ONLY — deliberately not `namespace`.
          #
          # applicationId is Android's identity for the installed app, which is what makes
          # the beta a separate install with its own storage. `namespace` is the Java package
          # that relative class names resolve against, and the manifest declares the activity
          # as ".MainActivity". Rewriting both (as a blanket sed over the file does) points
          # that at io.github.shrenikyd.echo.beta.MainActivity, a class that does not exist —
          # the app then dies with ClassNotFoundException the instant it launches.
          # The Java sources keep package io.github.shrenikyd.echo, so namespace must too.
          sed -i 's/^\( *applicationId \)"io\.github\.shrenikyd\.echo"/\1"io.github.shrenikyd.echo.beta"/' \
            android/app/build.gradle

          # Capacitor's own appId, used for the bridge and plugin identity.
          sed -i 's/"appId": "io\.github\.shrenikyd\.echo"/"appId": "io.github.shrenikyd.echo.beta"/' \
            capacitor.config.json
          sed -i 's/"appName": "ECHO"/"appName": "ECHO Beta"/' capacitor.config.json

          # package_name must track applicationId — plugins derive runtime identity from it.
          # custom_url_scheme must be unique too, or the two apps fight over the same scheme.
          sed -i 's|<string name="package_name">io.github.shrenikyd.echo</string>|<string name="package_name">io.github.shrenikyd.echo.beta</string>|' \
            android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="custom_url_scheme">io.github.shrenikyd.echo</string>|<string name="custom_url_scheme">io.github.shrenikyd.echo.beta</string>|' \
            android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="app_name">ECHO</string>|<string name="app_name">ECHO Beta</string>|' \
            android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">ECHO</string>|<string name="title_activity_main">ECHO Beta</string>|' \
            android/app/src/main/res/values/strings.xml

          echo "--- verifying: namespace must stay, applicationId must change ---"
          grep -E 'namespace|applicationId' android/app/build.gradle
          grep -q 'namespace = "io.github.shrenikyd.echo"' android/app/build.gradle \
            || { echo "::error::namespace was rewritten — the app would crash on launch"; exit 1; }
          grep -q 'applicationId "io.github.shrenikyd.echo.beta"' android/app/build.gradle \
            || { echo "::error::applicationId was not rebranded"; exit 1; }
          cat android/app/src/main/res/values/strings.xml

      - name: Install and build web assets
        run: |
          npm ci
          npx ng build --configuration beta --base-href /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: assistant/frontend/android

      # An unsigned release APK will not install. Signing it with a *stable* key is what
      # lets each build upgrade the last one in place: Android refuses to replace an app
      # with a build signed by a different key, so a per-run throwaway key forced an
      # uninstall — and an uninstall wipes localStorage, taking tasks, notes and the set
      # log with it. The keystore therefore lives in repo secrets, not in the workflow.
      #
      # The fallback exists so a fork or a repo without the secret still produces an
      # installable APK rather than failing the build; it just cannot upgrade in place.
      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Signing with the stable keystore from repo secrets."
            echo "$KEYSTORE_B64" | base64 -d > echo.keystore
            ALIAS="${KEY_ALIAS:-echo}"
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set — signing with a throwaway key."
            echo "::warning::This APK cannot upgrade an existing install; it must be uninstalled first."
            ALIAS=echo
            PASS=echo1234
            keytool -genkey -v -keystore echo.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=ECHO, OU=Personal, O=Personal, L=NA, S=NA, C=IN"
          fi

          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk echo-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks echo.keystore --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --ks-key-alias "$ALIAS" --out echo-beta.apk echo-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs echo-beta.apk
          rm -f echo.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: echo-beta-apk
          path: assistant/frontend/echo-beta.apk
          if-no-files-found: error

      # Actions artifacts need a GitHub login to download and arrive as a zip, which is
      # painful on a phone. A release asset is a plain public link you can tap directly.
      # A v* tag makes a versioned release; a manual run refreshes the rolling
      # "android-latest" one, so there is always a current APK at a stable URL.
      - name: Publish the APK as a release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assistant/frontend/echo-beta.apk
            assistant/frontend/version.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'android-beta' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ECHO Beta — hands-free preview' }}
          body: |
            **Beta build — unfinished features. Not a replacement for ECHO.**

            Installs as a separate app (`io.github.shrenikyd.echo.beta`, "ECHO Beta") with
            its own storage, so it sits alongside the real ECHO and shares none of its data.
            Set up your API key and Gist sync separately here.

            **Hands-free mode:** the microphone stays open, replies are spoken aloud, and
            whatever it hears is SENT — a mis-heard sentence becomes a real message, and can
            add or complete a task. Use it somewhere quiet, and read the transcript after.

            **Install:** download `echo-beta.apk` and allow installation from unknown
            sources when prompted.

            Built from `${{ github.sha }}`.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
