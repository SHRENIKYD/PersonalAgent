name: Build ECHO Android APK

# Runs on demand, or on a v* tag. Not on every push to main: an APK build is slow and
# nobody wants a new install prompt for a one-line CSS change.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant/frontend

    steps:
      - uses: actions/checkout@v4

      # Capacitor 8's CLI refuses to run on anything below Node 22. Angular 17 predates
      # Node 22 and warns about it, but only hard-fails on odd-numbered majors, so a
      # single Node 22 step serves both the web build and cap sync.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: assistant/frontend/package-lock.json

      # Capacitor loads the app from the APK's own assets over https://localhost, not from
      # a subpath, so this build must NOT use the /PersonalAgent/ base-href the Pages
      # workflow sets — with that in place every asset would 404 inside the app.
      # Stamped before the build so it is bundled into the APK's own assets, and published
      # alongside the APK so the installed app can compare the two. Without a build stamp
      # inside the app there is nothing to compare a release against — "is there an update"
      # needs to know what you are already running.
      # The version comes from package.json via sync-version.mjs, which also writes it into
      # src/app/version.ts and android/app/build.gradle — one number in one place, so the
      # APK's manifest, the bundle and this stamp can never disagree.
      - name: Stamp the build
        run: |
          node scripts/sync-version.mjs
          printf '{"version":"%s","sha":"%s","builtAt":"%s"}\n' \
            "$(node -p "require('./package.json').version")" \
            "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee src/assets/build-info.json version.json

      - name: Install and build web assets
        run: |
          npm ci
          npx ng build --configuration production --base-href /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: assistant/frontend/android

      # An unsigned release APK will not install. Signing it with a *stable* key is what
      # lets each build upgrade the last one in place: Android refuses to replace an app
      # with a build signed by a different key, so a per-run throwaway key forced an
      # uninstall — and an uninstall wipes localStorage, taking tasks, notes and the set
      # log with it. The keystore therefore lives in repo secrets, not in the workflow.
      #
      # The fallback exists so a fork or a repo without the secret still produces an
      # installable APK rather than failing the build; it just cannot upgrade in place.
      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Signing with the stable keystore from repo secrets."
            echo "$KEYSTORE_B64" | base64 -d > echo.keystore
            ALIAS="${KEY_ALIAS:-echo}"
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set — signing with a throwaway key."
            echo "::warning::This APK cannot upgrade an existing install; it must be uninstalled first."
            ALIAS=echo
            PASS=echo1234
            keytool -genkey -v -keystore echo.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=ECHO, OU=Personal, O=Personal, L=NA, S=NA, C=IN"
          fi

          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk echo-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks echo.keystore --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --ks-key-alias "$ALIAS" --out echo.apk echo-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs echo.apk
          rm -f echo.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: echo-apk
          path: assistant/frontend/echo.apk
          if-no-files-found: error

      # Actions artifacts need a GitHub login to download and arrive as a zip, which is
      # painful on a phone. A release asset is a plain public link you can tap directly.
      # A v* tag makes a versioned release; a manual run refreshes the rolling
      # "android-latest" one, so there is always a current APK at a stable URL.
      - name: Publish the APK as a release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assistant/frontend/echo.apk
            assistant/frontend/version.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'android-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ECHO — latest Android build' }}
          body: |
            Sideload build of ECHO for Android.

            **Install:** download `echo.apk`, open it on your phone, and allow
            installation from unknown sources when prompted.

            Signed with the project's stable key, so this upgrades an existing install in
            place and keeps your data. The one exception is upgrading *from* a build that
            predates that key — Android will ask you to uninstall first, once.

            Built from `${{ github.sha }}`.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
